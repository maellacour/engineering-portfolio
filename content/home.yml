build:
  title: What I build
  intro: >-
    Three threads run through the work — and they increasingly point the same
    way: toward AI-native engineering, grounded in tools I've actually shipped.
  items:
    - title: Research games & XR
      body: >-
        Cognitive-training games and VR tools used in studies across Geneva,
        Haifa and Miami — engaging enough that participants come back, reliable
        enough for clinical settings. Unity Certified Expert.
    - title: AI-augmented engineering
      body: >-
        I put AI to work on real codebases and real workflows: code agents on
        Unity and Flutter projects, a transcription-to-notes pipeline my whole
        team uses, shared conventions for building research software with AI.
        Currently going deeper: fine-tuning speech models for scientific
        vocabulary.
    - title: Full stack & infrastructure
      body: >-
        The unglamorous layer that keeps studies running: backends, data
        pipelines, CI/CD, cloud. If participants can log in on day one of a
        study, this is why.

projects:
  title: Selected work

about:
  title: About
  body: >-
    I didn't set out to build software for neuroscience. I trained as a Grande
    École engineer at Arts et Métiers and started in aerospace — my student work
    there even won an Airbus award. But the projects that pulled me in were
    always the ones where code met science.


    In 2020 I joined the Fondation Campus Biotech Geneva and found my place:
    turning research protocols into software people actually use. A VR tool a
    surgeon can navigate. A game engaging enough that study participants keep
    coming back — and reliable enough to run in a clinic. The quiet
    infrastructure that keeps a multi-site study alive.


    Six years in, I'm a Unity Certified Expert who has shipped across XR, mobile
    and full stack — and I'm now going deeper on AI, putting code agents and
    speech models to work in real engineering. When I'm not building, you'll
    probably find me paragliding above Geneva.
  image:
    src: mael.office.square.grayscale_enkzmk.jpg
    alt: Il jouait du code debout

